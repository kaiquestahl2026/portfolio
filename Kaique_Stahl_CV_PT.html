<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Currículo</title>
<script src="./config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: #fff; color: #111; max-width: 800px; margin: 0 auto; padding: 3rem 2.5rem; }
  .header { display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: start; border-bottom: 2px solid #111; padding-bottom: 1.5rem; margin-bottom: 1.75rem; }
  .header-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; object-position: center top; }
  h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .titulo { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: #555; margin-top: 0.4rem; line-height: 1.5; }
  .contatos { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-top: 0.75rem; font-family: 'DM Mono', monospace; font-size: 0.75rem; color: #444; }
  .contatos a { color: #2563eb; text-decoration: none; }
  h2 { font-size: 0.65rem; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; color: #2563eb; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.4rem; margin: 1.5rem 0 0.9rem; }
  .resumo { font-size: 0.85rem; line-height: 1.8; color: #333; }
  .exp-item { margin-bottom: 1.1rem; }
  .exp-header { display: flex; justify-content: space-between; align-items: baseline; }
  .exp-cargo { font-weight: 700; font-size: 0.92rem; }
  .exp-periodo { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: #777; }
  .exp-empresa { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: #555; margin: 0.15rem 0 0.4rem; }
  .exp-desc { font-size: 0.82rem; line-height: 1.75; color: #444; }
  .edu-item { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; margin-bottom: 0.75rem; }
  .edu-curso { font-weight: 700; font-size: 0.88rem; }
  .edu-inst { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: #555; }
  .edu-periodo { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: #777; text-align: right; }
  .edu-status { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: #2563eb; }
  .skills-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .skill-tag { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px; padding: 0.25rem 0.6rem; font-family: 'DM Mono', monospace; font-size: 0.72rem; color: #333; }
  .cert-list { list-style: none; }
  .cert-list li { font-size: 0.82rem; color: #444; padding: 0.2rem 0; }
  .cert-list li::before { content: '-> '; color: #2563eb; font-family: 'DM Mono', monospace; }
  .idiomas { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .idioma { font-family: 'DM Mono', monospace; font-size: 0.78rem; }
  .idioma span { color: #777; display: block; font-size: 0.68rem; }
  @media print { body { padding: 1.5rem; } @page { margin: 1.5cm; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="cv-nome"></h1>
    <p class="titulo" id="cv-titulo"></p>
    <div class="contatos" id="cv-contatos"></div>
  </div>
  <img class="header-photo" id="cv-foto" src="" alt="" />
</div>
<h2>Resumo</h2>
<p class="resumo" id="cv-bio"></p>
<h2>Experiencia Profissional</h2>
<div id="cv-exp"></div>
<h2>Formacao</h2>
<div id="cv-edu"></div>
<h2>Competencias</h2>
<div class="skills-grid" id="cv-skills"></div>
<h2>Certificacoes</h2>
<ul class="cert-list" id="cv-certs"></ul>
<h2>Idiomas</h2>
<div class="idiomas" id="cv-idiomas"></div>
<script>
document.title = CONFIG.nome + ' — Curriculo';
document.getElementById('cv-nome').textContent = CONFIG.nome;
document.getElementById('cv-titulo').textContent = CONFIG.titulo;
document.getElementById('cv-foto').src = CONFIG.fotoBase64 || CONFIG.foto || '';
document.getElementById('cv-foto').alt = CONFIG.nome;
document.getElementById('cv-bio').textContent = CONFIG.bio;
var c = document.getElementById('cv-contatos');
if (CONFIG.localizacao) c.innerHTML += '<span>📍 ' + CONFIG.localizacao + '</span>';
if (CONFIG.email) c.innerHTML += '<a href="mailto:' + CONFIG.email + '">' + CONFIG.email + '</a>';
if (CONFIG.telefone) c.innerHTML += '<span>📞 ' + CONFIG.telefone + '</span>';
if (CONFIG.linkedin) c.innerHTML += '<a href="' + CONFIG.linkedin + '" target="_blank">LinkedIn</a>';
var exp = document.getElementById('cv-exp');
(CONFIG.experiencia || []).forEach(function(e) {
  exp.innerHTML += '<div class="exp-item"><div class="exp-header"><span class="exp-cargo">' + e.cargo + '</span><span class="exp-periodo">' + e.periodo + '</span></div><div class="exp-empresa">' + e.empresa + ' · ' + e.local + '</div><p class="exp-desc">' + e.descricao + '</p></div>';
});
var edu = document.getElementById('cv-edu');
(CONFIG.formacao || []).forEach(function(f) {
  edu.innerHTML += '<div class="edu-item"><div><div class="edu-curso">' + f.curso + '</div><div class="edu-inst">' + f.instituicao + '</div></div><div><div class="edu-periodo">' + f.periodo + '</div><div class="edu-status">' + f.status + '</div></div></div>';
});
var sk = document.getElementById('cv-skills');
(CONFIG.skills || []).forEach(function(s) { sk.innerHTML += '<span class="skill-tag">' + s.nome + '</span>'; });
var ce = document.getElementById('cv-certs');
(CONFIG.certificacoes || []).forEach(function(ct) { ce.innerHTML += '<li>' + ct + '</li>'; });
var id = document.getElementById('cv-idiomas');
(CONFIG.idiomas || []).forEach(function(i) { id.innerHTML += '<div class="idioma">' + i.idioma + '<span>' + i.nivel + '</span></div>'; });
</script>
</body>
</html>
